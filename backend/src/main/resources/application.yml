spring:
  application:
    name: ailer-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com
  model: gpt-4o
  temperature: 0.3
  max-tokens: 2000
  embedding-model: text-embedding-3-small

# Active Directory — obrigatório no perfil prod
# Definir via variáveis de ambiente: AD_DOMAIN e AD_URL
ad:
  domain: ${AD_DOMAIN:tce.ce.gov.br}
  url: ${AD_URL:ldap://dc.tce.ce.gov.br:389}

# CORS — separado por vírgula; no dev o SecurityConfig já define localhost:5173
cors:
  allowed-origins: ${CORS_ORIGINS:https://ailer.tce.ce.gov.br}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    br.gov.tce.ailer: DEBUG
